name: build

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Pinned to the same toolchain release the mod is built with locally,
      # rather than the newest, so CI and local builds use one compiler version.
      - name: Install LLVM-MinGW
        shell: bash
        run: |
          tag=20260616
          curl -sSLo llvm-mingw.zip \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$tag/llvm-mingw-$tag-ucrt-x86_64.zip"
          7z x -y llvm-mingw.zip -o/c/toolchains > /dev/null
          echo "CLANG=/c/toolchains/llvm-mingw-$tag-ucrt-x86_64/bin/x86_64-w64-mingw32-clang.exe" >> "$GITHUB_ENV"

      # Runs the pure-client gate and the 95 manifest parser checks on the way.
      - name: Build DLTBRuntimeCrane.asi
        shell: bash
        working-directory: asi
        run: ./build-asi.sh DLTBRuntimeCrane.asi

      # Runs the manager unit tests and the startup selftest on the way.
      - name: Build CraneManager.exe
        shell: bash
        working-directory: manager
        run: ./build.sh

      # Packaged by the project's own script, so the archive has the same layout
      # as the Nexus download rather than one assembled here.
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) version="$(git rev-parse --short HEAD)" ;; esac
          mkdir -p dist
          python tools/make_package.py "dist/DLTBRuntimeCrane-$version.zip" \
            asi/DLTBRuntimeCrane.asi \
            manager/bin/Release/CraneManager.exe \
            asi/vendor/LICENSE.txt \
            layout/ph_ft/work/bin/x64/scripts/quick_hands.lua
          cd dist && sha256sum * | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: crane-package
          path: dist/

      # gh is preinstalled on the runner, so no third-party action is involved.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are this version's CHANGELOG.md section, so the release
          # says what changed. Provenance goes underneath, where it belongs.
          awk -v v="## $GITHUB_REF_NAME" '
            $0 == v {found = 1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "no CHANGELOG.md section for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          printf '\n---\n\n%s\n' \
            "Built from source by GitHub Actions. The archive has the same layout as the Nexus Mods download and installs the same way, but is not byte-identical to it: the linker records the build path, so the same source compiled on another machine produces different binaries. Checksums for this build are in SHA256SUMS.txt." \
            >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "DLTBRuntimeCrane $GITHUB_REF_NAME" \
            --notes-file notes.md
